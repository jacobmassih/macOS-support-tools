name: macOS 26 PR Build

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Test on macOS 26
    runs-on: macos-26
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check macOS version
        run: |
          sw_vers
          echo "macOS version: $(sw_vers -productVersion)"
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-macos26-${{ hashFiles('**/Podfile.lock', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-macos26-
      
      - name: Install dependencies
        run: |
          gem install slather -v 2.8.5 --no-document
          python3 -m venv "${{ runner.temp }}/diff-cover-venv"
          "${{ runner.temp }}/diff-cover-venv/bin/python" -m pip install diff-cover
          echo "${{ runner.temp }}/diff-cover-venv/bin" >> "$GITHUB_PATH"
      
      - name: Build project
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project macos-support-tools.xcodeproj \
            -scheme macos-support-tools \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      
      - name: Run unit tests
        env:
          UNIT_TEST_RESULT_BUNDLE: ${{ runner.temp }}/unit-tests.xcresult
        run: |
          set -o pipefail
          rm -rf "$UNIT_TEST_RESULT_BUNDLE"
          xcodebuild test \
            -project macos-support-tools.xcodeproj \
            -scheme macos-support-tools \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -only-testing:macos-support-toolsTests \
            -resultBundlePath "$UNIT_TEST_RESULT_BUNDLE" \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Generate coverage report
        run: |
          slather coverage --build-directory "${{ runner.temp }}/DerivedData"

      - name: Check changed-line coverage
        run: |
          set +e
          diff-cover coverage/cobertura.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=80 \
            --show-uncovered \
            --format markdown:coverage/diff-cover.md
          status=$?

          cat coverage/diff-cover.md >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
      
      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project macos-support-tools.xcodeproj \
            -scheme macos-support-tools \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:macos-support-toolsUITests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      
      - name: Generate test report
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Build completed on macOS $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-support-tools-build-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products/Release/*.app
          retention-days: 7
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/unit-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore
