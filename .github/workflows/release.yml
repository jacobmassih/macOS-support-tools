name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"

          case "${TAG}" in
            v*.*.*) ;;
            *) echo "::error::Release tag must look like v1.0.0"; exit 1 ;;
          esac

          echo "tag=${TAG}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_ENV}"
          echo "archive_name=macos-support-tools-${VERSION}-macos.zip" >> "${GITHUB_ENV}"

      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with write access to jacobmassih/homebrew-tap before releasing."
            exit 1
          fi

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app
        run: |
          xcodebuild clean build \
            -project macos-support-tools.xcodeproj \
            -scheme macos-support-tools \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            MARKETING_VERSION="${version}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          APP_PATH="${RUNNER_TEMP}/DerivedData/Build/Products/Release/macos-support-tools.app"
          RELEASE_DIR="${RUNNER_TEMP}/release"

          mkdir -p "${RELEASE_DIR}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${RELEASE_DIR}/${archive_name}"
          shasum -a 256 "${RELEASE_DIR}/${archive_name}" | tee "${RELEASE_DIR}/${archive_name}.sha256"

          echo "release_dir=${RELEASE_DIR}" >> "${GITHUB_ENV}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${tag}" \
            "${release_dir}/${archive_name}" \
            "${release_dir}/${archive_name}.sha256" \
            --title "${tag}" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: jacobmassih/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        working-directory: homebrew-tap
        run: |
          SHA256="$(awk '{print $1}' "${release_dir}/${archive_name}.sha256")"

          VERSION="${version}" SHA256="${SHA256}" ruby -pi -e 'sub(/^  version ".*"$/, %{  version "#{ENV.fetch("VERSION")}"}); sub(/^  sha256 ".*"$/, %{  sha256 "#{ENV.fetch("SHA256")}"})' Casks/macos-support-tools.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/macos-support-tools.rb
          git commit -m "Update macos-support-tools to ${version}"
          git push
